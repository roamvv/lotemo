databases:
  - name: lotemov1-staging-db
    plan: free
    region: singapore
    postgresMajorVersion: 16

services:
  - type: web
    name: lotemov1-staging
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    branch: staging
    healthcheckPath: /
    autoDeploy: false
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: lotemov1-staging-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false