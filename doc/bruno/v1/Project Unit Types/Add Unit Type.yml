info:
  name: Add Unit Type
  type: http
  seq: 2

http:
  method: POST
  url: "{{serverUrl}}/api/v1/projects/44210/unit-types"
  body:
    type: json
    data: |-
      {
        "name": "1 Bedroom",
        "bedroomCount": 1,
        "bathroomCount": 1,
        "minFloorAreaSqm": 28,
        "maxFloorAreaSqm": 40
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
