info:
  name: List Locations
  type: http
  seq: 1

http:
  method: GET
  url: "{{serverUrl}}/api/v1/locations"
  params:
    - name: "class"
      value: "CITY"
      type: query
    - name: "parentId"
      value: "14"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns the location tree used for the search filters (Country > Region > Province > City > Barangay).
  Filter by `class` and optionally `parentId` to page through the hierarchy.
