info:
  name: List Notifications
  type: http
  seq: 1

http:
  method: GET
  url: "{{serverUrl}}/api/v1/me/notifications"
  params:
    - name: "unread"
      value: "true"
      type: query
    - name: "page"
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
