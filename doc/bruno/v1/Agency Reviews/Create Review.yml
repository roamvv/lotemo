info:
  name: Create Review
  type: http
  seq: 2

http:
  method: POST
  url: "{{serverUrl}}/api/v1/agencies/7841002/reviews"
  body:
    type: json
    data: |-
      {
        "isAnonymous": false,
        "fullName": "Marco Villareal",
        "rating": 5,
        "comment": "Iain was responsive throughout and negotiated a fair price on our BGC unit. Smooth closing.",
        "class": "AGENCY"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
