info:
  name: Get Nearby Facilities
  type: http
  seq: 1

http:
  method: GET
  url: "{{serverUrl}}/api/v1/properties/3391077/nearby"
  params:
    - name: "radiusKm"
      value: "3"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Returns geo_points_of_interest rows within radiusKm of the property's gcsId, grouped by category (school, clinic, attraction…). Backed by a periodically refreshed cache, not a live Places API call.
