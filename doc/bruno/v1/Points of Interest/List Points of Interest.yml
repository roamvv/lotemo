info:
  name: List Points of Interest
  type: http
  seq: 2

http:
  method: GET
  url: "{{serverUrl}}/api/v1/points-of-interest"
  params:
    - name: "category"
      value: "SCHOOL"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Admin/ops listing of the raw POI cache, for auditing coverage rather than the per-property nearby view.
