info:
  name: List Properties
  type: http
  seq: 1

http:
  method: GET
  url: "{{serverUrl}}/api/v1/properties"
  params:
    - name: "city"
      value: "Taguig"
      type: query
    - name: "propertyType"
      value: "CONDO"
      type: query
    - name: "propertyStatus"
      value: "AVAILABLE"
      type: query
    - name: "minPrice"
      value: "5000000"
      type: query
    - name: "maxPrice"
      value: "12000000"
      type: query
    - name: "bedrooms"
      value: "2"
      type: query
    - name: "page"
      value: "1"
      type: query
    - name: "perPage"
      value: "24"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Main search/listing endpoint used on the marketplace homepage and search results page.
