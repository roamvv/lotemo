info:
  name: List Agencies
  type: http
  seq: 1

http:
  method: GET
  url: "{{serverUrl}}/api/v1/agencies"
  params:
    - name: "city"
      value: "Makati"
      type: query
    - name: "verification"
      value: "FULL_VERIFY"
      type: query
    - name: "page"
      value: "1"
      type: query
    - name: "perPage"
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
