info:
  name: List My Collections
  type: http
  seq: 1

http:
  method: GET
  url: "{{serverUrl}}/api/v1/collections"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Collections belong to an agency member (e.g. 'BGC Ready-for-Occupancy', 'Under 10M Makati'); used to group listings on an agent's public profile.
