info:
  name: List Projects
  type: http
  seq: 1

http:
  method: GET
  url: "{{serverUrl}}/api/v1/projects"
  params:
    - name: "city"
      value: "Cebu City"
      type: query
    - name: "projectType"
      value: "CONDOMINIUM"
      type: query
    - name: "page"
      value: "1"
      type: query
    - name: "perPage"
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
