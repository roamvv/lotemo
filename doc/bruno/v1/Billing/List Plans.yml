info:
  name: List Plans
  type: http
  seq: 1

http:
  method: GET
  url: "{{serverUrl}}/api/v1/billing/plans"
  params:
    - name: "type"
      value: "SUBSCRIPTION"
      type: query
    - name: "isActive"
      value: "true"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
