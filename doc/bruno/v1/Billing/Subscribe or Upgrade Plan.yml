info:
  name: Subscribe or Upgrade Plan
  type: http
  seq: 3

http:
  method: POST
  url: "{{serverUrl}}/api/v1/agencies/7841002/subscription"
  body:
    type: json
    data: |-
      {
        "planId": 8,
        "billingCycle": "MONTHLY",
        "paymentMethod": "card_4242"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  planId 8 = the 'AGENT' tier (see List Plans). Creates/updates biz_payment_subscriptions and charges the first period via biz_payments.
